services:
  db:
    image: postgres:16-alpine
    container_name: exam-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam_assistant
    ports:
      - "5432:5432"
    volumes:
      - exam_assistant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  exam_assistant_pgdata:
